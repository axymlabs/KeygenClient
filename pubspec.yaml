name: keygen_app
description: A licence manager for Keygen licensing servers.
publish_to: none
version: 1.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.2.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  path_provider: ^2.1.4
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/keygen-mark.png
