name: keygen_app
description: A native-feeling client for managing a Keygen licensing server.
publish_to: none
version: 1.0.3+4

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  intl: ^0.19.0
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/keygen-mark.png
